  /api/project-reference/{entityType}:
    parameters:
      - name: entityType
        in: path
        required: true
        description: Which reference dataset. Anything else is a 400.
        schema:
          type: string
          enum: [archetype, posture]

    get:
      tags: [project-reference]
      summary: List reference records of one entity type
      description: >
        Requires `projects-admin` or `admin`. Unlike the skills and plugins list
        endpoints, this read is authorised — the data is admin-owned. Returns
        active and inactive records alike.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectReferenceRecord"
        "400":
          description: Unknown entity type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      tags: [project-reference]
      summary: Create a reference record
      description: Requires `projects-admin` or `admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectReferenceRecord"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectReferenceRecord"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A record with this id already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/project-reference/{entityType}/{id}:
    parameters:
      - name: entityType
        in: path
        required: true
        schema:
          type: string
          enum: [archetype, posture]
      - name: id
        in: path
        required: true
        schema:
          type: string

    get:
      tags: [project-reference]
      summary: Get a reference record
      description: Requires `projects-admin` or `admin`. Deactivated records remain retrievable.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectReferenceRecord"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      tags: [project-reference]
      summary: Replace a reference record
      description: >
        Requires `projects-admin` or `admin`. The path owns the id; an `id` in the
        body is ignored, so an edit cannot move a record. Whole-record write —
        last writer wins, which is acceptable for this low-churn data.
        There is no delete endpoint: a referenced record must not be removable,
        so deactivate it via the status endpoint instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectReferenceRecord"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectReferenceRecord"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/project-reference/{entityType}/{id}/status:
    parameters:
      - name: entityType
        in: path
        required: true
        schema:
          type: string
          enum: [archetype, posture]
      - name: id
        in: path
        required: true
        schema:
          type: string

    put:
      tags: [project-reference]
      summary: Activate or deactivate a reference record
      description: >
        Requires `projects-admin` or `admin`. Separate from the update endpoint so
        the audit trail records `deactivated` / `reactivated` rather than a
        generic update. Deactivating stops a record being offered as a choice
        while existing references to it continue to resolve.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, inactive]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectReferenceRecord"
        "400":
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/projects:
    get:
      tags: [projects]
      summary: List synced projects with sync state and archetype drift
      description: >
        Projects mirrored from the "All Columns (Full View)" tab of the Nava
        Projects and Programs Database. Read-only — the sheet is the only write
        surface, and the API Lambda's IAM grant on this table omits write actions.
        Requires projects-admin or admin, reads included.


        One endpoint rather than two, so the drift summary and the project table
        cannot disagree about how fresh the data is.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Projects, column metadata, sync state, and drift findings
          content:
            application/json:
              schema:
                type: object
                required: [projects, column_groups, column_headers, sync, drift]
                properties:
                  projects:
                    type: array
                    description: >
                      One object per project. Attribute names are slugs derived
                      from the sheet headers, so the property set follows the
                      sheet rather than a fixed schema.
                    items:
                      type: object
                      required: [project_code]
                      properties:
                        project_code:
                          type: string
                          description: From the sheet's "Database code" column.
                          example: FC026
                        project_name:
                          type: string
                          example: CO COBEES
                        archetype_primary:
                          type: string
                          example: Product Team
                        archetype_additional:
                          type: string
                          description: Comma-separated; resolved per value.
                          example: Strategic Consulting Team, Data Modernization Team
                        first_seen_at:
                          type: string
                          format: date-time
                        last_synced_at:
                          type: string
                          format: date-time
                      additionalProperties:
                        type: string
                  column_groups:
                    type: object
                    description: >
                      Group label per stored column, from the row the sheet
                      declares above its header. Columns preceding the first
                      label are grouped as IDENTITY.
                    additionalProperties:
                      type: string
                    example:
                      database_code: IDENTITY
                      archetype_primary: FRAMEWORKS
                  column_headers:
                    type: object
                    description: The original sheet header for each stored slug.
                    additionalProperties:
                      type: string
                    example:
                      database_code: Database code
                      archetype_primary: Archetype (Primary)
                  sync:
                    $ref: "#/components/schemas/ProjectsSyncState"
                  drift:
                    $ref: "#/components/schemas/ProjectsDrift"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden — lacks the project-reference capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/initiatives:
    get:
      tags: [initiatives]
      summary: List synced AI initiatives with their resolved projects
      description: >
        AI initiatives mirrored from the first tab of the AI-initiatives workbook.
        Read-only — the sheet is the only write surface, and the API Lambda's IAM
        grant on this table omits write actions.


        Requires only a session. Deliberately NOT capability-gated, matching the
        Contract Explorer and unlike /api/projects: the hub exists so any delivery
        team member can see what AI work is running, and a capability role would be
        assigned to nobody.


        One endpoint rather than two, so the grid, the detail view, and the capture
        date cannot disagree about how fresh the data is.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
          description: >
            An initiative_id. The response is unchanged except that the named record
            additionally carries related_contracts. Detail-only because the grid
            renders no contracts, and computing the join for every record would read
            the contracts partition on every hub load. An id matching nothing is not
            an error — the plain list is returned and the page renders not-found.
          example: benefits-navigator-prototype
      responses:
        "200":
          description: Initiatives with their resolved projects, and the population state
          content:
            application/json:
              schema:
                type: object
                required: [initiatives, population]
                properties:
                  initiatives:
                    type: array
                    items:
                      $ref: "#/components/schemas/Initiative"
                  population:
                    $ref: "#/components/schemas/InitiativesPopulationState"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >
            The initiatives table or the projects table is not configured for this
            environment — or, on an `id` request that resolves to a project, the
            contracts table. Distinct from 500 on purpose — it means terraform apply
            has not run here yet, not that the read failed. A list request never
            consults the contracts table, so it is unaffected by that one's absence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >
            The read failed. Returns an error rather than an empty list, because the
            page IS the initiatives and an empty success would be a lie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
