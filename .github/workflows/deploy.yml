name: Deploy

on:
  push:
    branches:
      - main      # -> staging
      - release   # -> prod
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - prod

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Install API Lambda dependencies
        run: cd functions/api && pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  deploy:
    name: Deploy to ${{ github.ref_name == 'release' && 'prod' || 'staging' }}
    needs: test
    runs-on: ubuntu-latest

    # Maps branch -> GitHub environment (each has its own scoped secrets + reviewers)
    environment: ${{ github.ref_name == 'release' && 'production' || 'staging' }}

    permissions:
      id-token: write   # required for OIDC role assumption
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # reads version from packageManager field in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build site
        env:
          PUBLIC_LOGIN_URL: ${{ secrets.AUTH_LAMBDA_URL }}
        run: pnpm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy static site to S3
        run: |
          # Hashed assets — long cache (1 year), immutable
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET_NAME }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "registry/*"

          # HTML + registry JSON — no cache (always revalidate)
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET_NAME }} \
            --delete \
            --cache-control "no-cache" \
            --exclude "*" \
            --include "*.html" \
            --include "registry/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*.html" "/registry/*"

      - name: Deploy auth Lambda
        run: |
          cd functions/auth
          npm install --omit=dev
          zip -r ../../auth.zip .
          cd ../..
          aws lambda update-function-code \
            --function-name ${{ secrets.AWS_AUTH_LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://auth.zip

      - name: Deploy API Lambda
        run: |
          cd functions/api
          pnpm install --prod --shamefully-hoist
          zip -r ../../api.zip .
          cd ../..
          aws lambda update-function-code \
            --function-name ${{ secrets.AWS_API_LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://api.zip
