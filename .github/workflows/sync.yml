name: Sync Registry

on:
  schedule:
    - cron: '0 */4 * * *'  # every 4 hours
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual sync'
        required: false
        default: 'Manual trigger'

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production  # requires approved reviewer to trigger manually
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # reads version from packageManager field in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Sync registry
        env:
          GITHUB_TOKEN: ${{ secrets.REGISTRY_SCAN_TOKEN }}
          GITHUB_ORG: navapbc
        run: pnpm run sync

      - name: Commit updated registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry/index.json
          git diff --staged --quiet || git commit -m "chore: sync registry [skip ci]"
          git push
