name: Sync Registry

on:
  schedule:
    - cron: '0 */4 * * *'  # every 4 hours
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      reason:
        description: 'Reason for manual sync'
        required: false
        default: 'Manual trigger'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    permissions:
      contents: read
      id-token: write   # required for OIDC role assumption
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Install API Lambda dependencies
        run: cd functions/api && pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync registry to DynamoDB
        env:
          GITHUB_TOKEN: ${{ secrets.REGISTRY_SCAN_TOKEN }}
          GITHUB_ORG: navapbc
          SYNC_ENV: ${{ github.event_name == 'workflow_dispatch' && (inputs.environment == 'production' && 'prod' || 'staging') || 'staging' }}
        run: node scripts/sync-registry-v2.mjs --env $SYNC_ENV
