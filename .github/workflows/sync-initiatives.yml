name: Sync Initiatives

# Mirrors the first tab of the AI-initiatives workbook into the initiatives
# DynamoDB table, then checks every stated projectName against the project
# records.
#
# MANUAL DISPATCH ONLY — no schedule, deliberately. The workbook lost two columns
# during this feature's implementation (an `id` column and a `programId` column),
# so its shape has not yet been stable across even one steady-state run. Add a
# weekly cron once it has; see the Deferred section of
# docs/plans/2026-08-10-001-feat-initiatives-hub-and-sync-plan.md.
#
# The run FAILS when the sheet STATES a project name that matches no project
# record. That failure is the drift alarm, not a sync error — the initiatives
# synced fine. As of 2026-08-10 all 14 stated names resolve, so the expected
# steady state is green, which is exactly what makes a red run worth reading.
#
# A row stating NO project only warns. 14 of the 37 rows state none, plenty of
# initiatives are genuinely internal, and failing on 38% of the sheet would train
# whoever reads these runs to ignore red.
#
# IDS DERIVE FROM THE INITIATIVE TITLE, because the workbook supplies no id column
# any more. Two consequences worth knowing before you read a run:
#
#   - Retitling an initiative re-keys its row, so it appears as one create plus one
#     delete rather than an update. The job says so when both counts are non-zero.
#   - A BULK retitle therefore looks like a mass delete-and-recreate and trips the
#     delete ceiling, which refuses the run and writes nothing. That is the gate
#     working. Check the sheet for renames before re-running with force — force
#     waives the data-loss guard, which is not what a rename needs.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report the diff and the safety verdict without writing'
        required: false
        type: boolean
        default: false
      force:
        description: 'Waive the safety gate (row-count drop, delete ceiling, absolute floor). Never waives the zero-row refusal or the project-resolution failure.'
        required: false
        type: boolean
        default: false

jobs:
  sync-staging:
    name: Sync to staging
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write   # required for OIDC role assumption

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install API Lambda dependencies
        run: cd functions/api && pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Written outside the workspace so nothing that archives the checkout can
      # pick it up, and via a redirect rather than `echo` so the key never
      # appears in an argument list.
      - name: Write Google service-account key
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          umask 077
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_KEY" > "$RUNNER_TEMP/google-credentials.json"

      - name: Sync initiatives (staging)
        env:
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
          FORCE_FLAG: ${{ inputs.force && '--force' || '' }}
        run: |
          node scripts/sync-initiatives.mjs --env staging \
            --credentials "$RUNNER_TEMP/google-credentials.json" \
            $DRY_RUN_FLAG $FORCE_FLAG

      - name: Remove credential
        if: always()
        run: rm -f "$RUNNER_TEMP/google-credentials.json"

  # Gated on staging, and that ordering is the point: a sheet whose project names
  # do not resolve fails staging and never reaches prod.
  sync-prod:
    name: Sync to prod
    runs-on: ubuntu-latest
    environment: production
    needs: sync-staging
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install API Lambda dependencies
        run: cd functions/api && pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Write Google service-account key
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          umask 077
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_KEY" > "$RUNNER_TEMP/google-credentials.json"

      - name: Sync initiatives (prod)
        env:
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
          FORCE_FLAG: ${{ inputs.force && '--force' || '' }}
        run: |
          node scripts/sync-initiatives.mjs --env prod \
            --credentials "$RUNNER_TEMP/google-credentials.json" \
            $DRY_RUN_FLAG $FORCE_FLAG

      - name: Remove credential
        if: always()
        run: rm -f "$RUNNER_TEMP/google-credentials.json"
