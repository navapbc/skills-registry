name: Sync Initiatives

# Mirrors the `v2` tab of the AI-initiatives workbook into the initiatives
# DynamoDB table, then checks every stated Project name against the project
# records.
#
# MANUAL DISPATCH ONLY — no schedule, deliberately. The workbook keeps moving: it
# lost an `id` and a `programId` column during the original implementation, then
# on 2026-08-24 was reorganized onto a v2 tab with renamed columns, seven new
# ones, and a repopulated `id` column. Its shape has still not held steady across
# one full run. Add a weekly cron once it has.
#
# The run FAILS when the sheet STATES a project name that matches no project
# record. That failure is the drift alarm, not a sync error — the initiatives
# synced fine. As of 2026-08-24 all 14 stated names resolve, so the expected
# steady state is green, which is exactly what makes a red run worth reading.
#
# A row stating NO project only warns. 23 of the 46 rows state none, plenty of
# initiatives are genuinely internal, and failing on half the sheet would train
# whoever reads these runs to ignore red.
#
# IDS DERIVE FROM THE SHEET'S `id` COLUMN. Two consequences worth knowing before
# you read a run:
#
#   - Retitling an initiative is an ordinary UPDATE. It does not re-key the row,
#     the detail URL holds, and first_seen_at survives. This reverses the older
#     rule, so ignore any note claiming a rename is a delete plus a create.
#   - A RENUMBERING or re-sort of the id column is what now looks like a mass
#     delete-and-recreate, and it trips the delete ceiling, which refuses the run
#     and writes nothing. That is the gate working. Check the ids in the sheet
#     before re-running with force — force waives the data-loss guard.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report the diff and the safety verdict without writing'
        required: false
        type: boolean
        default: false
      force:
        description: 'Waive the safety gate (row-count drop, delete ceiling, absolute floor). Never waives the zero-row refusal or the project-resolution failure.'
        required: false
        type: boolean
        default: false

jobs:
  sync-staging:
    name: Sync to staging
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write   # required for OIDC role assumption

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install API Lambda dependencies
        run: cd functions/api && pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Written outside the workspace so nothing that archives the checkout can
      # pick it up, and via a redirect rather than `echo` so the key never
      # appears in an argument list.
      - name: Write Google service-account key
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          umask 077
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_KEY" > "$RUNNER_TEMP/google-credentials.json"

      - name: Sync initiatives (staging)
        env:
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
          FORCE_FLAG: ${{ inputs.force && '--force' || '' }}
        run: |
          node scripts/sync-initiatives.mjs --env staging \
            --credentials "$RUNNER_TEMP/google-credentials.json" \
            $DRY_RUN_FLAG $FORCE_FLAG

      - name: Remove credential
        if: always()
        run: rm -f "$RUNNER_TEMP/google-credentials.json"

  # Gated on staging, and that ordering is the point: a sheet whose project names
  # do not resolve fails staging and never reaches prod.
  sync-prod:
    name: Sync to prod
    runs-on: ubuntu-latest
    environment: production
    needs: sync-staging
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install API Lambda dependencies
        run: cd functions/api && pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Write Google service-account key
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          umask 077
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_KEY" > "$RUNNER_TEMP/google-credentials.json"

      - name: Sync initiatives (prod)
        env:
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
          FORCE_FLAG: ${{ inputs.force && '--force' || '' }}
        run: |
          node scripts/sync-initiatives.mjs --env prod \
            --credentials "$RUNNER_TEMP/google-credentials.json" \
            $DRY_RUN_FLAG $FORCE_FLAG

      - name: Remove credential
        if: always()
        run: rm -f "$RUNNER_TEMP/google-credentials.json"
